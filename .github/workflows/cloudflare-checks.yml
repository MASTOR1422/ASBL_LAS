name: Cloudflare readiness checks
concurrency:
  group: cloudflare-checks-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bun run build:cf
      - run: bun run lint
      - run: bun run typecheck
      - name: Check D1 schema
        run: test -s migrations/0001_initial.sql
      # Deployment remains a separate manually approved operation.
